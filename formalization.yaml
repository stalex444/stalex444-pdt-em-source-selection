fidelity:
  divergences: The Challenge restates every definition from Mathlib alone and writes the six Lorentz generators and the
    field action as explicit tables; the research modules obtain them from the orthogonal algebra and the bridge proves the
    two presentations equal. Covariance means the stated derivative law, not finite invariance. The sources are functions of
    the field components only; no dependence on spacetime position or field derivatives is admitted. "Quadratic" means the
    homogeneous degree-two class with symmetry built in. Jets are read with the index up, and the divergence uses deriv,
    which is zero on non-differentiable functions; every compared statement assumes a polynomial, C^3 or differentiable
    source. The seventeen-parameter family is stated as an explicit formula; the cross term is the polarization of the
    stress at a constant bivector (proved in the research module CrossSource, not a compared statement), and its
    correspondence with the elementary linear conservation laws of Maxwell's equations was verified by exact computation
    in review (PRIOR_WORK.md), not formalized.
review:
  status: self-assessed
  reviewers: []
  notes: A literature pass (Claude Code lit-scout, 6 October 2026) classified prior results by statement and fixed the
    framing used here; it is recorded in PRIOR_WORK.md. Five further AI reviews were run on 7 October 2026 and are
    recorded in reviews/ - statement fidelity of the twelve Lean statements against the prose, a hostile audit of the
    Challenge definitions with kernel-checked tests, a blind re-derivation of the four classifications in exact
    arithmetic, a calibration audit of every prose surface, and a second literature pass. Their findings are applied in
    this version (smoothClassification strengthened to an equivalence; prose brought to the content; the provenance
    record completed). These are AI reviews, not human peer review or Palomar acceptance.
alignment:
  namespace: PDTSourceSelection
  statements:
  - source: Among all symmetric homogeneous quadratic sources (210 free coefficients) on the six field components, Lorentz covariance under the six displayed generators together with zero eta-trace holds iff the source is the Maxwell stress up to a real scale.
    lean: PDTSourceSelection.quadraticSelection
    module: Solution
    status: proved
    note: The class is homogeneous degree two with symmetry built into the coefficient indexing; covariance is the infinitesimal derivative law under the six displayed generators.
  - source: The selected scale is unique.
    lean: PDTSourceSelection.quadraticUniqueness
    module: Solution
    status: proved
    note: Stated as a unique existence for a source in the homogeneous quadratic class satisfying both laws.
  - source: Two hundred and nine displayed linear coefficient equations are equivalent to the two laws on the homogeneous quadratic class.
    lean: PDTSourceSelection.finiteCertificate
    module: Solution
    status: proved
    note: The equations are displayed as explicit linear forms in the 210 coefficients.
  - source: Among homogeneous quadratic sources, vanishing divergence on every source-free Maxwell/Bianchi first jet selects the Maxwell stress line; covariance and trace zero are not assumed.
    lean: PDTSourceSelection.conservationSelection
    module: Solution
    status: proved
    note: Conservation is imposed jet-wise at a point; the six slots hold the contravariant components and D mu is the partial derivative along the mu-th coordinate; nonzero vacuum jets exist.
  - source: A conserved homogeneous quadratic source is invariant under the displayed Hodge map on the six components.
    lean: PDTSourceSelection.conservationHodgeInvariance
    module: Solution
    status: proved
    note: A corollary of the conservation selection and the Hodge invariance of the stress; not independent of it.
  - source: A symmetric source is globally C^3 and conserved on all source-free jets iff it lies in the seventeen-parameter family constant + cross(b) + Maxwell stress.
    lean: PDTSourceSelection.smoothClassification
    module: Solution
    status: proved
    note: Stated as an equivalence; the converse direction uses that every member of the family is C^3, symmetric and conserved.
  - source: For C^3 conserved covariant sources, zero field value is equivalent to zero trace and to the Maxwell line.
    lean: PDTSourceSelection.smoothZeroFieldSelection
    module: Solution
    status: proved
    note: Trace-free is not a hypothesis here; it is one of the three equivalent conditions.
  - source: Every everywhere-differentiable symmetric source obeying the sourceful exchange law at stiffness k on all Bianchi-compatible jets is a constant plus the Maxwell stress of scale exactly k, and conversely.
    lean: PDTSourceSelection.differentiableSourcefulClassification
    module: Solution
    status: proved
    note: The same real k appears in the law and in the conclusion; the cross term in the conclusion is zero.
  - source: With zero field value, the sourceful exchange law selects the Maxwell stress at the current stiffness.
    lean: PDTSourceSelection.differentiableNormalizedSelection
    module: Solution
    status: proved
    note: The zero-field normalization is the same hypothesis Navarro-Sancho use.
  - source: "eta times the scalar invariant is covariant but not trace-free: the trace condition is necessary in the quadratic selection."
    lean: PDTSourceSelection.traceNecessity
    module: Solution
    status: proved
    note: The counterexample lies in the homogeneous quadratic class and violates exactly the trace law.
  - source: "The anisotropic quadratic diag(x0^2, -x0^2, 0, 0) is trace-free but not covariant: covariance is necessary."
    lean: PDTSourceSelection.covarianceNecessity
    module: Solution
    status: proved
    note: The counterexample lies in the homogeneous quadratic class and violates exactly the covariance law.
  - source: "In the C^3 setting a conserved cross term is not covariant, and the constant eta is conserved and covariant with nonzero trace: covariance and the zero-field normalization are each necessary."
    lean: PDTSourceSelection.smoothNecessity
    module: Solution
    status: proved
    note: No necessity statement is made for the regularity, symmetry or homogeneity hypotheses.
