    shape; overlaps the sourceful statement, neither containing the other.
- title: On the uniqueness of the energy-momentum tensor for electromagnetism
  authors:
  - D. B. Kerrighan
  type: paper
  location: Journal of Mathematical Physics 23 (1982), 1979-1980, doi:10.1063/1.525217
  relationship: background
  author_endorsement: not-contacted
  note: The metric and the Maxwell stress are the only symmetric rank-two concomitants of a bivector and the metric whose
    divergence vanishes on source-free Maxwell solutions. General-covariant concomitant setting; overlaps the conservation
    selection here, neither containing the other.
- title: Classification of local conservation laws of Maxwell's equations
  authors:
  - S. C. Anco
  - J. Pohjanpelto
  type: paper
  location: https://arxiv.org/abs/math-ph/0108017
  relationship: background
  author_endorsement: not-contacted
  note: Complete classification of local conservation laws of Maxwell's equations. Its order-zero sector yields the
    conservation selection and the shape of the seventeen-parameter family as an unstated corollary; the symmetric-tensor
    statements and the cross family are not stated there. The cross family matches the symmetric assembly of their
    elementary linear currents at a constant bivector and its Hodge dual (verified by exact computation in review on 7
    October 2026, not formalized).
- title: Energy and electromagnetism of a differential k-form
  authors:
  - J. Navarro
  - J. B. Sancho
  type: paper
  location: Journal of Mathematical Physics 53 (2012), 102501
  relationship: background
  author_endorsement: not-contacted
  note: Theorem 3.5 obtains the Maxwell stress with its coefficient fixed by the current from naturality, scale
    independence, vanishing at zero field, and a sourceful divergence identity on closed forms, for natural operators on
    any Lorentzian manifold. The sourceful statement here reaches the same conclusion under different, incomparable
    hypotheses - symmetric, field-only sources on one fixed flat frame, everywhere differentiable, with the same zero-field
    normalization but no naturality or scale axiom.
