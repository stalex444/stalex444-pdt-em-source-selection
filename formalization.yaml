  notes: A literature pass (Claude Code lit-scout, 6 October 2026) classified prior results by statement and fixed the
    framing used here; it is recorded in PRIOR_WORK.md. No adversarial proof review has yet been run on this package.
    These are AI reviews, not human peer review or Palomar acceptance.
