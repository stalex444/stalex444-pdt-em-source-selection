- title: The electromagnetic energy momentum tensor and its uniqueness
  authors:
  - D. Lovelock
  type: paper
  location: International Journal of Theoretical Physics 10 (1974), 59-65, doi:10.1007/BF01808316
  relationship: background
  author_endorsement: not-contacted
  note: A symmetric tensor concomitant of the metric, a field and its first derivatives, generally covariant, with a
    divergence identity of exchange-law shape and a free coefficient tensor, is reported essentially unique (hypotheses
