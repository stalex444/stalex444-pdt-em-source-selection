version: v0.4
project:
  name: Selection of the electromagnetic source tensor by covariance, conservation and the exchange law
  description: On a fixed flat Lorentz frame with metric diag(1,1,1,-1), sources are symmetric 4x4 tensor-valued
    functions of the six real components of an antisymmetric field. Twelve kernel-checked statements. Among all
    symmetric quadratic sources (210 free coefficients), the six infinitesimal Lorentz covariance equations together
    with zero trace select the Maxwell stress up to a unique real scale, and a displayed certificate of 209 linear
    coefficient equations is equivalent to both laws. Conservation alone - vanishing divergence on every source-free
    Maxwell/Bianchi first jet - selects the same line, with covariance, trace zero and Hodge invariance derived rather
    than assumed. Every globally C^3 symmetric conserved source lies in an explicit seventeen-parameter family
    (constant, a six-parameter cross term, and the stress), and with covariance zero field value is equivalent to zero
    trace and to the stress line. Under the sourceful exchange law at current stiffness k, every everywhere-differentiable
    symmetric source is a constant plus the Maxwell stress of scale exactly k, with no polynomial, degree, C^3, covariance
    or trace hypothesis; zero field value selects the stress. Explicit counterexamples show each hypothesis is necessary.
    Uniqueness of the Maxwell stress tensor is classical (Fock 1964; Kerrighan 1982; Navarro-Sancho 2012; the
    classification of Maxwell conservation laws by Anco-Pohjanpelto 2001); the contribution is the constructive,
    kernel-checked development on the explicit register with finite certificates, the covariance-free routes, and the
    differentiable-only sourceful statement. Pisot Dimensional Theory motivates the frame; no physical coupling is selected.
  authors:
  - Stephanie Alexander
  license: MIT
  responsible_maintainers:
  - Stephanie Alexander
