  - method: agent
    models:
    - OpenAI GPT-family (Codex) for the research proofs; Anthropic Claude (Claude Code) for the extraction and port
    framework: Codex; Claude Code
    tool_setup: Human-directed theorem selection and Lean kernel proofs in the PDT research (Codex, 29-30 September 2026).
      Extraction, port to Lean 4.35.0-rc2 with pinned Mathlib, Challenge statement surface, statement bridge, metadata and
      local verification by Claude Code (6 October 2026). Ordinary kernel-checked tactics; no native_decide.
    cost:
      wall_time: Research 29-30 September 2026; packaging 6 October 2026; cumulative effort not tracked
      spend_usd: not tracked
      hardware: local machine
    prompting_notes: Stephanie Alexander directed the PDT research and selected this result for registration. Port changes
      were limited to module-system declarations, guarding simplification steps that no longer act, and one heartbeat budget;
      no statement or proof logic was changed. The original research files are preserved with their verification receipts.
  spend_usd: not tracked
  notes: AI-assisted development and local kernel checking do not constitute human peer review or a novelty determination.
    Verification status is recorded in VERIFICATION.md.
fidelity:
  divergences: The Challenge restates every definition from Mathlib alone and writes the six Lorentz generators and the
    field action as explicit tables; the research modules obtain them from the orthogonal algebra and the bridge proves the
    two presentations equal. Covariance means the stated derivative law, not finite invariance. The sources are functions of
    the field components only; no dependence on spacetime position or field derivatives is admitted. The seventeen-parameter
    family is stated as an explicit formula; its correspondence with the elementary linear conservation laws of Maxwell's
    equations is a remark in PRIOR_WORK.md, not a formalized claim.
